<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Propdesk" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Propdesk</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      /* Flutter [HtmlElementView] + Google Identity Services: browser focus rings and
       tap feedback often draw outside the pill; this keeps them from showing as
       large arcs on the left/right. */
      html,
      body {
        -webkit-tap-highlight-color: transparent;
      }
      [id^="sign_in_button_"] {
        overflow: hidden !important;
        border-radius: 9999px;
        outline: none !important;
      }
      [id^="sign_in_button_"] * {
        outline: none !important;
        -webkit-tap-highlight-color: transparent !important;
      }
      [id^="sign_in_button_"] iframe {
        outline: none !important;
      }
    </style>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
