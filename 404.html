<!DOCTYPE html>
<html>
<head>
  <!--
    GitHub Pages: serve this file on unknown paths so the Flutter SPA can handle /login, etc.
    Kept in sync with index.html (flutter build copies both to build/web/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="propdesk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>propdesk</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Match index.html — Google Sign-In web control focus/tap (see index.html) */
    html, body {
      -webkit-tap-highlight-color: transparent;
    }
    [id^="sign_in_button_"] {
      overflow: hidden !important;
      border-radius: 9999px;
      outline: none !important;
    }
    [id^="sign_in_button_"] * {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    [id^="sign_in_button_"] iframe {
      outline: none !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
